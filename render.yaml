services:
  - type: web
    name: careerpilot-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerpilot-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: jsearch.p.rapidapi.com
      - key: CHROMA_DB_PATH
        value: ./chroma_db
    healthCheckPath: /health
    autoDeploy: false

databases:
  - name: careerpilot-db
    databaseName: careerpilot
    plan: free